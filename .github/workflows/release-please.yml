on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Bumps package.json, updates CHANGELOG.md, opens a release PR,
          # and tags/releases when that PR is merged.
          release-type: node
